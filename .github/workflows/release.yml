# Builds the Linux x86_64 binary and attaches it to a GitHub release when a v* tag is pushed.
# Only Linux is built because it is the only platform delve has been tested on.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the crate version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != crate v$version"; exit 1; }

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Library builds without the terminal UI
        run: cargo test --locked --lib --no-default-features

      - name: Build
        run: cargo build --release --locked

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="delve-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp target/release/delve README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
