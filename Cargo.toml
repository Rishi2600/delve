[package]
name = "dungeon-delve"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "A terminal roguelike that turns a directory into a dungeon: folders are rooms, files are monsters, and it never writes to disk"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rishi2600/delve"
readme = "README.md"
keywords = ["roguelike", "tui", "game", "terminal", "filesystem"]
categories = ["games", "command-line-utilities"]
exclude = [".github/"]

# The package is called dungeon-delve (the name delve is taken on crates.io),
# but the command stays `delve`. The library is imported as `dungeon_delve`.
[[bin]]
name = "delve"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `delve` command: the terminal UI plus argument parsing.
cli = ["tui", "dep:clap"]
# `dungeon_delve::tui`: play a game in the terminal (ratatui + crossterm).
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
ignore = "0.4.33"
rand = "0.10.3"
rand_chacha = "0.10.0"
clap = { version = "4.6.7", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }

[package.metadata.docs.rs]
all-features = true

# Tests simulate whole games (BFS, bots); optimise them so they stay fast.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
